name: deskypt
description: "DeskYPT - Yeolpumta Desktop Client"
publish_to: 'none'

version: 1.0.2+3

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State Management & Hooks
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5
  flutter_hooks: ^0.20.5
  hooks_riverpod: ^2.5.1

  # Routing
  go_router: ^14.2.0

  # Networking & Storage
  dio: ^5.5.0+1
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.2.3

  # Media & Visuals
  cached_network_image: ^3.3.1
  just_audio: ^0.9.38
  fl_chart: ^0.68.0
  lottie: ^3.1.2
  flutter_svg: ^2.0.10+1

  # Localization & Utilities
  easy_localization: ^3.0.7
  lucide_icons_flutter: any
  intl: any
  window_manager: ^0.3.9

  # Auth
  google_sign_in: ^6.2.1
  sign_in_with_apple: ^6.1.1

  # Models & JSON
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0

  cupertino_icons: ^1.0.8
  file_picker: ^11.0.3
  syncfusion_flutter_pdfviewer: ^33.2.13
  path_provider: ^2.1.6
  url_launcher: ^6.3.0
  flutter_markdown: ^0.7.7+1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0
  build_runner: ^2.4.11
  freezed: ^2.5.2
  json_serializable: ^6.8.0
  riverpod_generator: ^2.4.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  image_path: "assets/icons/splash_logo.png"
  windows:
    generate: true
    image_path: "assets/icons/splash_logo.png"
    icon_size: 48
  macos:
    generate: true
    image_path: "assets/icons/splash_logo.png"
  linux:
    generate: true
    image_path: "assets/icons/splash_logo.png"

flutter:
  uses-material-design: true

  assets:
    - assets/translations/
    - assets/icons/
    - assets/images/
    - assets/lottie/

  fonts:
    - family: Pretendard
      fonts:
        - asset: assets/fonts/Pretendard-Thin.otf
          weight: 100
        - asset: assets/fonts/Pretendard-ExtraLight.otf
          weight: 200
        - asset: assets/fonts/Pretendard-Light.otf
          weight: 300
        - asset: assets/fonts/Pretendard-Regular.otf
          weight: 400
        - asset: assets/fonts/Pretendard-Medium.otf
          weight: 500
        - asset: assets/fonts/Pretendard-SemiBold.otf
          weight: 600
        - asset: assets/fonts/Pretendard-Bold.otf
          weight: 700
        - asset: assets/fonts/Pretendard-ExtraBold.otf
          weight: 800
        - asset: assets/fonts/Pretendard-Black.otf
          weight: 900
    - family: E1234
      fonts:
        - asset: assets/fonts/E1234.ttf
